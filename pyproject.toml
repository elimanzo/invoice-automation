[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-automation"
version = "0.1.0"
description = "Multi-agent invoice processing: ingestion, validation, approval, payment"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.0",
    "pdfplumber>=0.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiofiles>=24.1",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
]

[project.scripts]
invoice-automation = "invoice_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recorded provider responses are shipped with the package: without them a
# non-editable install has a fake provider that cannot answer anything.
"invoice_automation" = ["sample_responses/*.json", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "main.py"]
